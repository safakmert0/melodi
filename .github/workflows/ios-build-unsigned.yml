name: iOS Build Unsigned IPA

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze || true

      - name: Debug plugin list
        run: |
          echo "=== .flutter-plugins-dependencies (ios) ==="
          python3 -c "import json,sys; d=json.load(open('.flutter-plugins-dependencies')); print('\n'.join(p['name'] for p in d['plugins']['ios']))" 2>/dev/null || cat .flutter-plugins-dependencies

      - name: Install CocoaPods
        run: |
          rm -f Podfile.lock
          pod install --repo-update
        working-directory: ./ios

      - name: Patch Xcode for unsigned CI build
        run: |
          cd ios
          python3 - <<'PY'
          import re
          p = 'Runner.xcodeproj/project.pbxproj'
          s = open(p).read()
          def repl(m):
              eol = m.group(1)
              return (m.group(0)
                      + '\t\t\t\tDEVELOPMENT_TEAM = "AAAAAAAAAA";' + eol
                      + '\t\t\t\tCODE_SIGNING_ALLOWED = NO;' + eol
                      + '\t\t\t\tCODE_SIGNING_REQUIRED = NO;' + eol)
          s2 = re.sub(r'CODE_SIGN_STYLE = Automatic;(\r?\n)', repl, s)
          open(p, 'w').write(s2)
          print('patched' if s2 != s else 'NO CHANGE')
          PY
          grep -n "CODE_SIGNING_ALLOWED" Runner.xcodeproj/project.pbxproj || echo "ALLOWED not found"

      - name: Build iOS via flutter (unsigned)
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build ios --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }} \
            --no-codesign
          
          # IPA oluştur (unsigned)
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r melodi-${{ github.ref_name }}-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: melodi-*-unsigned.ipa
          retention-days: 30
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-*-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}