# DEPRECATED: Bu workflow legacy'dir. Tag release için build-ipa.yml, full Go+Flutter için ios-build.yml kullanın.
# Uyumluluk için korunuyor (Flutter 3.35.4 + macos-15/Xcode16.4 ile senkronize edildi).
name: iOS Build Unsigned IPA (Legacy)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze || true

      - name: Debug plugin list
        run: |
          echo "=== .flutter-plugins-dependencies (ios) ==="
          python3 -c "import json,sys; d=json.load(open('.flutter-plugins-dependencies')); print('\n'.join(p['name'] for p in d['plugins']['ios']))" 2>/dev/null || cat .flutter-plugins-dependencies

      - name: Install CocoaPods
        run: |
          rm -f Podfile.lock
          pod install --repo-update
        working-directory: ./ios

      - name: Build iOS via flutter (unsigned)
        run: |
          flutter pub get
          flutter gen-l10n
          cd ios
          pod install
          # Imzasiz derleme: pod install bunu geri almadigi icin base config'e ekliyoruz.
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nDEVELOPMENT_TEAM = AAAAAAAAAA\nCODE_SIGN_STYLE = Manual\n' >> Flutter/Release.xcconfig
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nDEVELOPMENT_TEAM = AAAAAAAAAA\nCODE_SIGN_STYLE = Manual\n' >> Flutter/Debug.xcconfig
          cd ..
          flutter build ios --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }} \
            --no-codesign

          # IPA oluştur (unsigned)
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r melodi-${{ github.ref_name }}-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: melodi-*-unsigned.ipa
          retention-days: 30
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-*-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}