name: iOS Build Unsigned IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n
      
      - name: Debug plugin list
        run: |
          echo "=== .flutter-plugins-dependencies (ios) ==="
          python3 -c "import json,sys; d=json.load(open('.flutter-plugins-dependencies')); print('\n'.join(p['name'] for p in d['plugins']['ios']))" 2>/dev/null || cat .flutter-plugins-dependencies

      - name: Install CocoaPods
        run: |
          rm -f Podfile.lock
          pod install --repo-update
        working-directory: ./ios
      
      - name: Build iOS via xcodebuild (unsigned)
        run: |
          # Dart kodunu derle
          flutter pub get
          flutter gen-l10n
          
          # Xcode ile derle (Dart dahil, codesiz)
          cd ios
          xcodebuild clean archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath ../build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            FLUTTER_BUILD_MODE=release \
            FLUTTER_BUILD_NAME=${{ github.ref_name }} \
            FLUTTER_BUILD_NUMBER=${{ github.run_number }}
          
          # IPA oluştur (unsigned)
          cd ..
          mkdir -p Payload
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r melodi-${{ github.ref_name }}-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: melodi-*-unsigned.ipa
          retention-days: 30
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-*-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}