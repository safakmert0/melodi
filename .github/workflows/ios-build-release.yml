name: iOS Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze || true

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: ./ios

      - name: Build iOS (unsigned)
        run: |
          cd ios
          pod install
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nDEVELOPMENT_TEAM = AAAAAAAAAA\nCODE_SIGN_STYLE = Manual\n' >> Flutter/Release.xcconfig
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nDEVELOPMENT_TEAM = AAAAAAAAAA\nCODE_SIGN_STYLE = Manual\n' >> Flutter/Debug.xcconfig
          cd ..
          flutter build ios --release \
            --build-name=${GITHUB_REF_NAME#v} \
            --build-number=${{ github.run_number }} \
            --no-codesign
      
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r melodi-${{ github.ref_name }}-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: melodi-*-unsigned.ipa
          retention-days: 30
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-*-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}