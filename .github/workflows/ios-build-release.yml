name: iOS Build & Release (Unsigned IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n
      
      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: ./ios
      
      - name: Build iOS via xcodebuild (NO flutter build ios)
        run: |
          xcodebuild clean build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
        working-directory: .
      
      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r melodi-unsigned-${{ github.ref_name }}.ipa Payload
          rm -rf Payload
        working-directory: .
      
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-unsigned-${{ github.ref_name }}
          path: melodi-unsigned-*.ipa
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-unsigned-*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}