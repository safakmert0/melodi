name: iOS Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n
      
      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: ./ios
      
      - name: Patch Xcode project for unsigned build
        run: |
          cd ios
          # Find all pbxproj files and patch DEVELOPMENT_TEAM to dummy value
          for proj in Runner.xcodeproj/project.pbxproj; do
            # Remove any existing DEVELOPMENT_TEAM lines
            sed -i '' '/DEVELOPMENT_TEAM/d' "$proj"
            # Add dummy DEVELOPMENT_TEAM after every PROVISIONING_PROFILE_SPECIFIER line
            sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/a\
            DEVELOPMENT_TEAM = ABCD1234EF;\' "$proj"
            # Also add to buildSettings blocks that don't have it
            sed -i '' '/buildSettings {/a\
            DEVELOPMENT_TEAM = ABCD1234EF;\' "$proj"
          done
          echo "Patched DEVELOPMENT_TEAM"
      
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }} \
            --no-codesign
      
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r melodi-${{ github.ref_name }}-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: melodi-*-unsigned.ipa
          retention-days: 30
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: melodi-*-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}