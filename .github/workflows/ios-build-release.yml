name: iOS Build & Release (Unsigned for Sideloadly)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.5.0)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.tool_cache }}/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n
      
      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ./ios
      
      - name: Set dummy Development Team in Xcode project
        run: |
          # Add dummy DEVELOPMENT_TEAM to Runner project (required for flutter build ios --no-codesign)
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "ABC123DEFG";/g' ios/Runner.xcodeproj/project.pbxproj
          # Also add to target if not present
          sed -i '' '/DEVELOPMENT_TEAM = "ABC123DEFG";/! s/\(DEVELOPMENT_TEAM = \)"";/\1"ABC123DEFG";/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Development Team set to dummy value"
      
      - name: Build iOS Release (No Code Signing)
        run: |
          flutter build ios --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }} \
            --no-codesign
      
      - name: Create Unsigned IPA (for Sideloadly resigning)
        run: |
          # Create unsigned .app bundle
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            archive
          
          # Export as unsigned IPA (development method, no signing)
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist ios/ExportOptions-Unsigned.plist \
            -allowProvisioningUpdates
        working-directory: ./ios
      
      - name: Verify IPA structure
        run: |
          ls -la ios/build/ios/
          unzip -l ios/build/ios/*.ipa | head -30
      
      - name: Upload Unsigned IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-unsigned-${{ github.ref_name }}
          path: ios/build/ios/*.ipa
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ios/build/ios/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}