name: iOS Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.5.0)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.tool_cache }}/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate localization files
        run: flutter gen-l10n
      
      - name: Setup Ruby/Bundler for CocoaPods
        run: |
          gem install bundler
          bundle install
        working-directory: ./ios
      
      - name: Install CocoaPods dependencies
        run: bundle exec pod install --repo-update
        working-directory: ./ios
      
      - name: Update ExportOptions.plist with secrets
        run: |
          sed -i '' "s|YOUR_TEAM_ID|${{ secrets.IOS_TEAM_ID }}|g" ios/ExportOptions.plist
          sed -i '' "s|Melodi App Store Profile|${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}|g" ios/ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      
      - name: Set up code signing
        run: |
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      
      - name: Update provisioning profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > Melodi.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp Melodi.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      
      - name: Build iOS Release
        run: |
          flutter build ios --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }}
      
      - name: Create IPA
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            archive
          
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates
        working-directory: ./ios
      
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: melodi-ios-${{ github.ref_name }}
          path: ios/build/ios/*.ipa
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ios/build/ios/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}