name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup iOS project
        run: |
          # flutter create sets up iOS project structure + plugin references
          flutter create . --platforms=ios

          # Patch Podfile: set platform to 13.0
          sed -i '' 's/platform :ios, .*/platform :ios, '\''13.0'\''/' ios/Podfile

          # Overwrite entitlements
          cat > ios/Runner/Runner.entitlements << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>keychain-access-groups</key>
            <array>
              <string>$(AppIdentifierPrefix)com.melodi.app</string>
            </array>
          </dict>
          </plist>
          XMLEOF

          # Set development team
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Debug.xcconfig
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Release.xcconfig

          # Patch project.pbxproj
          python3 << 'PYEOF'
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx) as f:
              content = f.read()
          content = content.replace('com.example.melodi', 'com.melodi.app')
          content = content.replace('com.example.melodiV2', 'com.melodi.app')
          if 'CODE_SIGN_ENTITLEMENTS' not in content:
              marker = 'PRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              replacement = 'CODE_SIGN_ENTITLEMENTS = "Runner/Runner.entitlements";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              content = content.replace(marker, replacement)
          with open(pbx, 'w') as f:
              f.write(content)
          PYEOF

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS Device (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          DEVICE_APP=$(find build/ios/iphoneos -name "Runner.app" -maxdepth 1)
          if [ -z "$DEVICE_APP" ]; then
            echo "Runner.app not found in device build"
            find build/ios/ -name "Runner.app" -type d
            exit 1
          fi
          # Check IPA size
          echo "=== Runner.app size ==="
          du -sh "$DEVICE_APP"
          echo "=== Frameworks in Runner.app ==="
          ls -la "$DEVICE_APP/Frameworks/" 2>/dev/null || echo "No Frameworks directory"
          mkdir -p build/unsigned_ipa/Payload
          cp -r "$DEVICE_APP" build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -r ../Melodi-${GITHUB_REF_NAME}.ipa Payload/
          echo "=== IPA size ==="
          ls -lh ../Melodi-${GITHUB_REF_NAME}.ipa

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Melodi-${{ github.ref_name }}.ipa
          fail_on_unmatched_files: false
          body: |
            ## Melodi ${{ github.ref_name }}

            ### Kurulum
            1. [SideStore](https://sidestore.io) veya [Sideloadly](https://sideloadly.io) indirin
            2. IPA dosyasını yükleyin
            3. Apple ID ile imzalayın ve kurun

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Melodi-${{ github.ref_name }}-ipa
          path: build/Melodi-${{ github.ref_name }}.ipa
