name: Build iOS
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Setup iOS project
        run: |
          # Build the checked-in iOS project as-is. Re-running `flutter create`
          # here can replace AppDelegate/Info.plist and silently remove Melodi's
          # background-audio and native channel configuration.
          sed -i '' 's/platform :ios, .*/platform :ios, '\''16.0'\''/' ios/Podfile

          python3 << 'PYEOF'
          import hashlib

          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx) as f:
              content = f.read()

          for relative_path in ["MelodiPlatformHandlers.swift", "MelodiHLS/HLSDownloader.swift"]:
              filename = relative_path.split('/')[-1]
              if filename in content:
                  continue
              file_ref_id = hashlib.md5(relative_path.encode()).hexdigest()[:24].upper()
              build_file_id = hashlib.md5((relative_path + '.build').encode()).hexdigest()[:24].upper()
              file_ref = f'\t\t{file_ref_id} /* {filename} */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = {relative_path}; sourceTree = "<group>"; }};'
              build_file = f'\t\t{build_file_id} /* {filename} in Sources */ = {{isa = PBXBuildFile; fileRef = {file_ref_id} /* {filename} */; }};'
              content = content.replace('/* End PBXFileReference section */', f'{file_ref}\n/* End PBXFileReference section */')
              content = content.replace('/* End PBXBuildFile section */', f'{build_file}\n/* End PBXBuildFile section */')
              content = content.replace(
                  '74858FAE1ED2DC5600515810 /* AppDelegate.swift */,',
                  f'{file_ref_id} /* {filename} */,\n\t\t\t\t74858FAE1ED2DC5600515810 /* AppDelegate.swift */,'
              )
              content = content.replace(
                  '74858FAF1ED2DC5600515810 /* AppDelegate.swift in Sources */,',
                  f'{build_file_id} /* {filename} in Sources */,\n\t\t\t\t74858FAF1ED2DC5600515810 /* AppDelegate.swift in Sources */,'
              )

          with open(pbx, 'w') as f:
              f.write(content)
          PYEOF

          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Debug.xcconfig
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Release.xcconfig

          python3 << 'PYEOF'
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx) as f:
              content = f.read()
          content = content.replace('com.example.melodi', 'com.melodi.app')
          content = content.replace('com.example.melodiV2', 'com.melodi.app')
          if 'CODE_SIGN_ENTITLEMENTS' not in content:
              marker = 'PRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              replacement = 'CODE_SIGN_ENTITLEMENTS = "Runner/Runner.entitlements";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              content = content.replace(marker, replacement)
          with open(pbx, 'w') as f:
              f.write(content)
          PYEOF

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS Device (unsigned)
        run: |
          BUILD_NAME=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          flutter build ios --release --no-codesign \
            --build-name "$BUILD_NAME" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Package as IPA
        run: |
          DEVICE_APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$DEVICE_APP" ]; then
            echo "Runner.app not found in device build"
            find build/ios/ -name "Runner.app" -type d
            exit 1
          fi
          echo "=== Runner.app size ==="
          du -sh "$DEVICE_APP"
          echo "=== Frameworks in Runner.app ==="
          ls -la "$DEVICE_APP/Frameworks/" 2>/dev/null || echo "No Frameworks directory"
          mkdir -p build/unsigned_ipa/Payload
          cp -r "$DEVICE_APP" build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -r ../Melodi-${GITHUB_REF_NAME}.ipa Payload/
          echo "=== IPA size ==="
          ls -lh ../Melodi-${GITHUB_REF_NAME}.ipa

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Melodi-${{ github.ref_name }}.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Melodi-${{ github.ref_name }}-ipa
          path: build/Melodi-${{ github.ref_name }}.ipa
