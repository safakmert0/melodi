name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Setup iOS project
        run: |
          # Save our custom Swift handlers before flutter create overwrites ios/
          cp ios/Runner/MelodiPlatformHandlers.swift /tmp/MelodiPlatformHandlers.swift 2>/dev/null || true
          cp ios/Runner/Runner.entitlements /tmp/Runner.entitlements 2>/dev/null || true

          # flutter create sets up iOS project structure + plugin references
          flutter create . --platforms=ios

          # Restore our custom Swift handlers
          cp /tmp/MelodiPlatformHandlers.swift ios/Runner/MelodiPlatformHandlers.swift
          cp /tmp/Runner.entitlements ios/Runner/Runner.entitlements

          # Add the Swift file to Xcode project
          python3 << 'PYEOF'
          import uuid
          import hashlib

          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx) as f:
              content = f.read()

          # Check if MelodiPlatformHandlers.swift is already in the project
          if 'MelodiPlatformHandlers.swift' not in content:
              # Generate a deterministic ID from the filename
              file_ref_id = hashlib.md5(b'MelodiPlatformHandlers.swift').hexdigest()[:24].upper()
              build_file_id = hashlib.md5(b'MelodiPlatformHandlers.swift.build').hexdigest()[:24].upper()

              # Add PBXFileReference
              file_ref = f'\t\t{file_ref_id} /* MelodiPlatformHandlers.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = MelodiPlatformHandlers.swift; sourceTree = "<group>"; }};'
              content = content.replace('/* End PBXFileReference section */', f'/* End PBXFileReference section */\n{file_ref}')

              # Add PBXBuildFile
              build_file = f'\t\t{build_file_id} /* MelodiPlatformHandlers.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {file_ref_id} /* MelodiPlatformHandlers.swift */; }};'
              content = content.replace('/* End PBXBuildFile section */', f'/* End PBXBuildFile section */\n{build_file}')

              # Add to Runner group children (before AppDelegate.swift)
              content = content.replace(
                  '74858FAE1ED2DC5600515810 /* AppDelegate.swift */,',
                  f'{file_ref_id} /* MelodiPlatformHandlers.swift */,\n\t\t\t\t74858FAE1ED2DC5600515810 /* AppDelegate.swift */,'
              )

              # Add to Sources build phase
              content = content.replace(
                  '74858FAF1ED2DC5600515810 /* AppDelegate.swift in Sources */,',
                  f'{build_file_id} /* MelodiPlatformHandlers.swift in Sources */,\n\t\t\t\t74858FAF1ED2DC5600515810 /* AppDelegate.swift in Sources */,'
              )

              with open(pbx, 'w') as f:
                  f.write(content)
              print("Added MelodiPlatformHandlers.swift to Xcode project")
          else:
              print("MelodiPlatformHandlers.swift already in project")
          PYEOF

          # iOS 16+ hedefi, yerel proje ve güncel Flutter ile aynı tutulur.
          sed -i '' 's/platform :ios, .*/platform :ios, '\''16.0'\''/' ios/Podfile

          # Set development team
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Debug.xcconfig
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Flutter/Release.xcconfig

          # Patch project.pbxproj: bundle ID and entitlements
          python3 << 'PYEOF'
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx) as f:
              content = f.read()
          content = content.replace('com.example.melodi', 'com.melodi.app')
          content = content.replace('com.example.melodiV2', 'com.melodi.app')
          if 'CODE_SIGN_ENTITLEMENTS' not in content:
              marker = 'PRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              replacement = 'CODE_SIGN_ENTITLEMENTS = "Runner/Runner.entitlements";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.melodi.app;'
              content = content.replace(marker, replacement)
          with open(pbx, 'w') as f:
              f.write(content)
          PYEOF

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS Device (unsigned)
        run: |
          BUILD_NAME=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          flutter build ios --release --no-codesign \
            --build-name "$BUILD_NAME" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Package as IPA
        run: |
          DEVICE_APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$DEVICE_APP" ]; then
            echo "Runner.app not found in device build"
            find build/ios/ -name "Runner.app" -type d
            exit 1
          fi
          echo "=== Runner.app size ==="
          du -sh "$DEVICE_APP"
          echo "=== Frameworks in Runner.app ==="
          ls -la "$DEVICE_APP/Frameworks/" 2>/dev/null || echo "No Frameworks directory"
          mkdir -p build/unsigned_ipa/Payload
          cp -r "$DEVICE_APP" build/unsigned_ipa/Payload/
          cd build/unsigned_ipa
          zip -r ../Melodi-${GITHUB_REF_NAME}.ipa Payload/
          echo "=== IPA size ==="
          ls -lh ../Melodi-${GITHUB_REF_NAME}.ipa

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Melodi-${{ github.ref_name }}.ipa
          fail_on_unmatched_files: false
          body_path: RELEASE_NOTES_4.2.4.md

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Melodi-${{ github.ref_name }}-ipa
          path: build/Melodi-${{ github.ref_name }}.ipa
