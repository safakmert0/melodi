name: melodi
description: A source-aware music library, streaming companion, downloader, and local player for iOS.
publish_to: 'none'
version: 5.11.0+32

environment:
  sdk: ^3.4.0
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  audio_session: ^0.1.21

  # Music Scanning & Metadata
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  audio_metadata_reader: ^1.4.1

  # File Import
  file_picker: ^8.0.3
  open_filex: ^4.7.0

  # UI
  audio_video_progress_bar: ^2.0.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # URL Launcher
  url_launcher: ^6.3.1

  # JollyTone parity: multi-client stream manifest + imza cozme + HLS
  youtube_explode_dart: ^3.1.0

  # Arka planda indirme (iOS URLSession): uygulama arkaplanda da surer
  background_downloader: ^9.5.9

  # Sharing
  share_plus: ^12.0.2

  # Store review prompt
  in_app_review: ^2.0.9

  # In-app purchases (donations / tips via StoreKit)
  in_app_purchase: ^3.1.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Color extraction from images
  palette_generator: ^0.3.3

  # Utilities
  crypto: ^3.0.6
  uuid: ^4.4.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  http: ^1.2.1
  html: ^0.15.6
  path_provider: ^2.1.4
  path: ^1.9.1

  dynamic_color: 1.7.0
  flutter_secure_storage: ^10.3.1
  logger: ^2.5.0
  sqflite: ^2.4.2

  intl: ^0.20.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path: 1.9.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.png
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
