name: melodi
description: A source-aware music library, streaming companion, downloader, and local player for iOS.
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management - Riverpod + Provider (Provider legacy main.dart icin gerekli, kademeli gecis)
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Database - Drift (type-safe SQL)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20

  # Persistent Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Playback
  just_audio: ^0.9.39
  audio_service: ^0.18.13

  # Music Scanning & Metadata
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  audio_metadata_reader: ^1.4.1

  # File Import
  file_picker: ^8.0.3
  open_filex: ^4.7.0

  # UI
  audio_video_progress_bar: ^2.0.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  flutter_animate: ^4.5.0
  reorderables: ^0.6.0
  flutter_svg: ^2.0.10+1

  # URL Launcher
  url_launcher: ^6.3.1

  # YouTube integration
  youtube_explode_dart: ^3.1.0

  # WebView for account login
  webview_flutter: ^4.10.0

  # Sharing
  share_plus: ^12.0.2

  # In-app purchases (donations / tips via StoreKit)
  in_app_purchase: ^3.1.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Color extraction from images
  palette_generator: ^0.3.3

  # Utilities
  crypto: ^3.0.6
  uuid: ^4.4.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  http: ^1.2.1
  path_provider: ^2.1.4
  path: ^1.9.1

  # SpotiFLAC ports
  dynamic_color: 1.7.0
  flutter_secure_storage: ^10.3.1
  logger: ^2.5.0
  flutter_js: ^0.8.2
  ffi: ^2.1.3
  sqflite: ^2.4.2

  # Observability
  sentry_flutter: ^9.28.0

  intl: ^0.20.2
  shared_preferences: ^2.2.2
  package_info_plus: ^9.0.1
  pointycastle: ^4.0.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

dependency_overrides:
  path: 1.9.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.png
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
