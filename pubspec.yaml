name: melodi
description: A source-aware music library, streaming companion, downloader, and local player for iOS.
publish_to: 'none'
version: 4.8.0+17

environment:
  sdk: ^3.2.0
  flutter: ^3.16.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio: ^0.9.39
  audio_service: ^0.18.13

  # Music Scanning & Metadata
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  audio_metadata_reader: ^1.4.1

  # File Import
  file_picker: ^8.0.3
  open_filex: ^4.7.0

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI
  audio_video_progress_bar: ^2.0.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  flutter_animate: ^4.5.0
  reorderables: ^0.6.0

  # URL Launcher
  url_launcher: ^6.3.1

  # YouTube integration
  youtube_explode_dart: ^3.1.0

  # WebView for account login
  webview_flutter: ^4.10.0

  # Sharing
  share_plus: ^12.0.2

  # In-app purchases (donations / tips via StoreKit)
  in_app_purchase: ^3.1.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Color extraction from images
  palette_generator: ^0.3.3

  # Utilities
  crypto: ^3.0.6
  uuid: ^4.4.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  http: ^1.2.1

  # SpotiFLAC ports
  dynamic_color: 1.7.0
  flutter_secure_storage: ^10.3.1
  logger: ^2.5.0

  intl: ^0.20.3
  shared_preferences: ^2.2.2
  package_info_plus: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path: ^1.9.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/app_icon.png
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
